# starter_v0 — intentionally incomplete first-draft declarations.
# Students improve routing guidance, argument conventions, missing-information
# handling, and confirmation boundaries through v1/v2/v3.
#
# Keep built-in names and supplied evaluation cases unchanged.
# Improve descriptions and compatible schemas. Declare team-built bonus tools
# here and in tools/__init__.py, then test them with team-authored cases.
tools:
  # ---------------- Core tools ----------------
  - name: clarify
    description: "Gửi một câu hỏi cho người dùng."
    parameters:
      type: object
      properties:
        question: {type: string, default: "", description: "Câu hỏi"}
        response_type: {type: string, enum: [text, yes_no, choice], default: "text", description: "Kiểu trả lời"}
        options: {type: array, default: [], items: {type: string}, description: "Các lựa chọn"}
      required: [question]

  - name: search_kb
    description: "Tìm hướng dẫn hỗ trợ kỹ thuật."
    parameters:
      type: object
      properties:
        query: {type: string, default: "", description: "Nội dung cần tìm"}
        category: {type: string, enum: [all, vpn, email, wifi, printing, account, security, hardware, software, meeting_room], default: "all", description: "Nhóm hướng dẫn"}
        top_k: {type: integer, default: 3, description: "Số kết quả"}
      required: [query]

  - name: check_service_status
    description: "Kiểm tra trạng thái một dịch vụ."
    parameters:
      type: object
      properties:
        service: {type: string, enum: [vpn, email, sso, wifi, printing], description: "Tên dịch vụ"}
        environment: {type: string, enum: [production, staging], default: "production", description: "Môi trường"}
      required: [service]

  - name: inspect_device
    description: "Kiểm tra thông tin và chẩn đoán thiết bị. asset_id phải là mã tài sản thiết bị (ví dụ LT-204), không dùng mã nhân viên."
    parameters:
      type: object
      properties:
        asset_id: {type: string, description: "Mã tài sản thiết bị, ví dụ LT-204. Không truyền mã nhân viên vào đây."}
        check: {type: string, enum: [all, network, vpn, security, hardware, software], default: "all", description: "Nhóm kiểm tra. Nếu người dùng đã nêu rõ hệ thống gặp sự cố (VPN, Wi-Fi/network, bảo mật, phần cứng, phần mềm), chọn đúng nhóm đó thay vì để mặc định 'all'. Chỉ dùng 'all' khi không rõ hệ thống nào bị ảnh hưởng."}
      required: [asset_id]

  - name: lookup_user
    description: "Tra cứu người dùng trong danh bạ hỗ trợ. Kết quả đã bao gồm thiết bị được cấp cho nhân viên đó, nên không cần gọi thêm inspect_device sau lookup_user trừ khi người dùng yêu cầu chẩn đoán sâu hơn trên chính thiết bị đó."
    parameters:
      type: object
      properties:
        employee_id: {type: string, description: "Mã nhân viên"}
      required: [employee_id]

  - name: format_incident_report
    description: "Trình bày các kết quả đã có thành báo cáo."
    parameters:
      type: object
      properties:
        findings:
          type: array
          default: []
          description: "Các kết quả đã thu thập"
          items:
            type: object
            properties:
              label: {type: string}
              detail: {type: string}
              source: {type: string}
              status: {type: string}
        template: {type: string, enum: [brief, technical, handoff], default: "brief", description: "Mẫu báo cáo"}
        incident_title: {type: string, default: "IT incident", description: "Tiêu đề"}
      required: [findings, template]

  # ---------------- Optional/advanced tools ----------------
  - name: search_device_info
    description: "Tìm thông tin công khai về một model thiết bị trên web. Chỉ truyền hãng, model và loại thông tin; không truyền asset ID, employee ID hoặc dữ liệu nội bộ."
    parameters:
      type: object
      properties:
        manufacturer: {type: string, description: "Hãng sản xuất công khai, ví dụ Lenovo"}
        model: {type: string, description: "Tên model công khai, ví dụ ThinkPad T14 Gen 4"}
        query_type: {type: string, enum: [specs, drivers, support, compatibility], default: "support", description: "Loại thông tin cần tìm"}
        max_results: {type: integer, default: 3, description: "Số kết quả, tối đa 5"}
      required: [manufacturer, model, query_type]

  - name: policy
    description: "Tìm trong chính sách IT nội bộ. Chọn policy_area hẹp nhất theo chủ đề thay vì all khi đã rõ: external_tools cho AI/SaaS, vendor hoặc công cụ bên thứ ba và việc chia sẻ thông tin nội bộ ra ngoài; data_privacy cho dữ liệu cá nhân/nhạy cảm; access_control cho quyền truy cập; ticketing cho quy trình ticket. Chỉ dùng all khi chủ đề thực sự mơ hồ hoặc trải trên nhiều nhóm."
    parameters:
      type: object
      properties:
        query: {type: string, default: "", description: "Nội dung cần tìm"}
        policy_area: {type: string, enum: [all, access_control, data_privacy, external_tools, incident_response, service_operations, ticketing], default: "all", description: "Nhóm chính sách hẹp nhất. external_tools: AI/SaaS, công cụ hoặc vendor bên thứ ba, chia sẻ thông tin nội bộ ra ngoài. Chỉ dùng all nếu chưa xác định được một nhóm cụ thể."}
        top_k: {type: integer, default: 3, description: "Số mục"}
      required: [query]

  - name: create_ticket
    description: "Tạo một ticket hỗ trợ. Chỉ gọi sau khi đã dùng clarify(yes_no) hỏi lại đúng nội dung (summary, priority, asset_id) và người dùng đã trả lời đồng ý ở lượt hiện tại. Nếu bất kỳ nội dung nào đổi sau khi đã xác nhận, phải hỏi xác nhận lại với nội dung mới trước khi gọi tool này."
    parameters:
      type: object
      properties:
        summary: {type: string, default: "", description: "Tóm tắt sự cố"}
        priority: {type: string, enum: [low, medium, high, critical], default: "medium", description: "Mức ưu tiên"}
        asset_id: {type: string, default: "", description: "Mã tài sản nếu có"}
        confirmed: {type: boolean, default: false, description: "Đã được người dùng xác nhận đúng nội dung summary/priority/asset_id hiện tại qua clarify(yes_no) ở lượt gần nhất, không phải xác nhận cho nội dung cũ"}
      required: [summary]
